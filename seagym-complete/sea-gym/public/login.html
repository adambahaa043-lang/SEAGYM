<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in – SEAGYM</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="login-page">
    <form id="login-form" class="login-card" novalidate>
      <p class="brand">SEAGYM</p>
      <h1>Sign in</h1>
      <p class="hint" style="margin-bottom:1.25rem">Staff and members use the same portal. You will be directed to the correct dashboard.</p>
      <p id="login-error" class="error" role="alert" hidden></p>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required>
        <span id="err-username" class="error"></span>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="row">
          <input id="password" name="password" type="password" autocomplete="current-password" required style="flex:1">
          <button type="button" id="toggle-pw" class="btn alt sm">Show</button>
        </div>
        <span id="err-password" class="error"></span>
      </div>
      <button class="btn" id="login-btn" style="width:100%;margin-top:.5rem">Sign in</button>
      <p style="margin-top:1rem;text-align:center"><a href="/">← Back to website</a></p>

      <div class="demo-box">
        <strong>Demo accounts</strong> (for testing)
        <ul style="margin:.5rem 0 0;padding-left:1.1rem">
          <li>Admin: <code>Admin01</code> / <code>Admin001</code></li>
          <li>Member: <code>demo1</code> / <code>Demo@12345</code></li>
          <li>Member: <code>demo2</code> / <code>Demo@12345</code></li>
        </ul>
      </div>
    </form>
  </div>
  <script>
  const $ = s => document.querySelector(s);
  $('#toggle-pw').addEventListener('click', () => {
    const p = $('#password');
    const show = p.type === 'password';
    p.type = show ? 'text' : 'password';
    $('#toggle-pw').textContent = show ? 'Hide' : 'Show';
  });
  $('#login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const u = $('#username').value.trim();
    const p = $('#password').value;
    const err = $('#login-error');
    err.hidden = true;
    if (!u || !p) {
      err.textContent = 'Enter both username and password.';
      err.hidden = false;
      return;
    }
    const btn = $('#login-btn');
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Login failed');
      if (data.user.role === 'admin') location.href = '/dashboard';
      else location.href = '/member';
    } catch (ex) {
      err.textContent = ex.message;
      err.hidden = false;
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  });
  // If already logged in, redirect
  fetch('/api/me').then(r => r.ok ? r.json() : null).then(d => {
    if (d && d.user) location.href = d.user.role === 'admin' ? '/dashboard' : '/member';
  }).catch(() => {});
  </script>
</body>
</html>
